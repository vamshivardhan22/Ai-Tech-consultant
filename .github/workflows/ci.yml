name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task1-knowledge-brain/requirements.txt
          pip install -r task3-meeting-to-scope/requirements.txt
          pip install pytest
      - name: Compile Python services
        run: |
          python -m py_compile task1-knowledge-brain/main.py
          python -m py_compile task3-meeting-to-scope/main.py
      - name: Test Knowledge Brain
        working-directory: task1-knowledge-brain
        run: pytest -q
      - name: Test Meeting-to-Scope
        working-directory: task3-meeting-to-scope
        run: pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and type-check Inbox Agent
        working-directory: task2-inbox-agent
        run: |
          npm install --no-audit --no-fund
          npm run check

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build services
        run: docker compose build
